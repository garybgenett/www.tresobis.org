################################################################################
# composer settings file
################################################################################

variables:
  title-prefix:				"Tresobis"

########################################
  site-config:

    brand:				null
    homepage:				http://www.tresobis.org
    search:
      name: |
        <!-- composer >> icon search -->
      site:				https://duckduckgo.com
      call:				q
      form: |
        <!-- composer >> form sites tresobis.org -->
        <!-- composer >> form ia web -->
        <!-- composer >> form kae d -->
        <!-- composer >> form ko 1 -->
        <!-- composer >> form kp -1 -->
        <!-- composer >> form kv 1 -->
        <!-- composer >> form kz -1 -->
    copyright: |
      <!-- composer >> icon copyright -->
      Copyright (c) 2023, Gary B. Genett

    header:				<composer_root>/_header.md.cms
    footer:				<composer_root>/_footer.md.cms

#>  css_overlay:			custom
    css_overlay:			null
    copy_protect:			1

    cols:
      order:				[ 2, 1, 0 ]
      reorder:				[ 0, 1, 0 ]
      size:				[ 4, 8, 0 ]
      resize:				[ 0, 12, 0 ]

    metalist:
      type:
        title:				"Type"
        display:			"*Type: <|>, <|>*"

########################################
  site-library:

    folder:				library
    auto_update:			null #>>> 1

    digest:
      count:				20

    lists:
      expanded:				null
      spacer:				null

    sitemap:
      spacer:				null

########################################
  site-nav-top:

    MENU:
      - Latest:				<composer_root>/index.html
#>  CONTENTS:
#>    - Contents:
#>      - contents
#>  SPACE:
#>    - spacer
    LIBRARY:
      - Authors:
        - library author
      - Types:
        - library type
      - Tags:
        - library tags
      - History:
        - library date
    SPACE:
      - spacer
    CONTENTS:
      - Contents:
        - contents

########################################
  site-nav-bottom:

    PATH:
      - Sitemap:			<composer_root>/library/sitemap.html
    INFO:
      - metalist author
      - metalist type
      - metalist tags

########################################
  site-nav-left:

    MENU:
    SPACE:
    CONTENTS:
      - box-begin 0 Contents
      - contents
      - box-end
    METADATA:
#>    - spacer
#>    - metalist author
#>    - metalist type
#>    - metalist tags
#>    - readtime

########################################
  site-nav-right:

    MENU:
    SPACE:
    LIBRARY:
      - fold-begin group fold-library
      - fold-begin 0 0 fold-library Authors
      - library author
      - fold-end
      - fold-begin 0 0 fold-library Types
      - library type
      - fold-end
      - fold-begin 0 0 fold-library Tags
      - library tags
      - fold-end
      - fold-begin 0 0 fold-library History
      - library date
      - fold-end

########################################
  site-info-top:

    TEXT:
    INFO:
    ICON:
#>    - icon <composer_root>/../garybgenett/_branding/logo.png author http://www.garybgenett.net Gary B. Genett

########################################
  site-info-bottom:

    TEXT:
    INFO:
      - readtime
    ICON:

################################################################################
# end of file
################################################################################
